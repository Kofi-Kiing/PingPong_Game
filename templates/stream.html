<!DOCTYPE html>
<html>
  <head>
    <title>Hand Paddle</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: 'Inter', sans-serif;
        color: white;
      }

      #stats {
        width: 1280px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 4px;
        font-size: 0.75rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #4A5568;
      }

      #stats span {
        color: #F7FAFC;
        font-weight: 500;
      }

      img {
        display: block;
      }

      #controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #restartBtn {
        background: #1a202c;
        color: #f7fafc;
        border: 1px solid #4a5568;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #restartBtn:disabled {
        opacity: 0.6;
        cursor: default;
      }

      #cameraStatus {
        color: #a0aec0;
        font-size: 0.65rem;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div id="stats">
      <p>Score &nbsp;<span id="score">0</span></p>
      <p>Lives &nbsp;<span id="lives">5</span></p>
      <div id="controls">
        <button id="restartBtn" type="button">Restart Camera</button>
        <span id="cameraStatus"></span>
      </div>
    </div>
    <img id="videoStream" src="/video_feed" width="1280" height="720">

    <script>
      const socket = io();
      const restartBtn = document.getElementById("restartBtn");
      const cameraStatus = document.getElementById("cameraStatus");
      const videoStream = document.getElementById("videoStream");

      async function restartCamera() {
        restartBtn.disabled = true;
        cameraStatus.textContent = "Restarting...";
        try {
          const response = await fetch("/restart_camera", { method: "POST" });
          if (!response.ok) {
            throw new Error("Restart request failed");
          }
          videoStream.src = "/video_feed?t=" + Date.now();
          cameraStatus.textContent = "Camera restarted";
        } catch (error) {
          cameraStatus.textContent = "Restart failed";
        } finally {
          setTimeout(() => {
            cameraStatus.textContent = "";
          }, 2500);
          restartBtn.disabled = false;
        }
      }

      restartBtn.addEventListener("click", restartCamera);

      socket.on("game_update", (data) => {
        document.getElementById("score").textContent = data.score;
        document.getElementById("lives").textContent = data.lives;
      });

      socket.on("game_over", (data) => {
        window.location.href = "/gameover?score=" + data.score;
      });
    </script>
  </body>
</html>
